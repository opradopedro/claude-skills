<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Motor de cenas do canal de engenharia (estilo "You built it"): desenho vetorial plano em corte,
// um mundo so que evolui etapa por etapa. render.py chama setup(historia) e depois render(t) quadro a quadro.
// historia = {segs, cenas, eventos, destaque, gancho, dur}; tempos ja resolvidos em segundos (comum.py).
const W = 1080, H = 1920;
const c = document.getElementById('c'), x = c.getContext('2d');
let ST = { segs: [], cenas: [], eventos: [], destaque: [], gancho: null, dur: 1 };
let RX = null;

function rnd(seed) { const s = Math.sin(seed * 12.9898) * 43758.5453; return s - Math.floor(s); }
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const back = t => { t = clamp(t); const s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const mixc = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;

const E = {
  list: tipo => ST.eventos.filter(e => e.tipo === tipo),
  at: tipo => { const e = ST.eventos.find(e => e.tipo === tipo && e.t >= E.cena0 - 0.5); return e ? e.t : Infinity; },
  pulse: (t, tipo, len = 0.35) => { let k = 0; for (const e of E.list(tipo)) { const d = t - e.t; if (d >= 0 && d < len) k = Math.max(k, 1 - d / len); } return k; },
  since: (t, tipo) => { const a = E.at(tipo); return t >= a ? t - a : -1; },
  cena0: 0, cena1: 0,
};

const PAL = {
  sky0: '#7cc8f2', sky1: '#d4f0ff', grass: '#5cb85c', grass2: '#3f9a46', top: '#8a5a3a', sub: '#a06c45',
  rock: '#3d332e', water: '#3a9be0', ink: '#1d2430', cream: '#fff6e5', concrete: '#a9adb3', concrete2: '#8a8f96',
  waste: [107, 74, 43], liquid: [126, 170, 150], sludge: [74, 50, 30], scum: [214, 186, 92], clean: [80, 170, 240],
  red: '#ff4b3e', green: '#2fcf6a', yellow: '#ffd23a',
};
const FONT = '"Inter", "Arial Black", system-ui, sans-serif';

function rr(x0, y0, w, h, r) { x.beginPath(); x.roundRect(x0, y0, w, h, r); }
function pill(cx, cy, txt, bg, fg, size = 40, s = 1) {
  if (s <= 0.01) return;
  x.save(); x.translate(cx, cy); x.scale(s, s);
  x.font = `900 ${size}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  const w = x.measureText(txt).width + size * 1.1, h = size * 1.6;
  x.fillStyle = 'rgba(0,0,0,0.25)'; rr(-w / 2 + 4, -h / 2 + 7, w, h, h / 2); x.fill();
  x.fillStyle = bg; rr(-w / 2, -h / 2, w, h, h / 2); x.fill();
  x.fillStyle = fg; x.fillText(txt, 0, 2);
  x.restore();
}

// ---------------- geometria do mundo ----------------
const G = 560;                                      // linha do chao
const TX0 = 420, TX1 = 720, TY0 = 600, TY1 = 920;   // fossa
const WT0 = 1000, WT1 = 1100;                        // lencol freatico
const WX0 = 975, WX1 = 1025;                         // poco
const PIPE_IN = [[300, 520], [300, 640], [TX0, 640]];
const PIPE_OUT = [[TX1, 680], [760, 680], [935, 680]];

function polyAt(pts, u) {
  const segs = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); tot += d; }
  let r = u * tot;
  for (let i = 0; i < segs.length; i++) { if (r <= segs[i]) { const k = r / segs[i]; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; } r -= segs[i]; }
  return pts[pts.length - 1];
}
function pipe(pts, w, upto = 1, col = '#e9eef2', edge = '#5b6672') {
  if (upto <= 0) return;
  const n = 40, path = []; for (let i = 0; i <= n; i++) path.push(polyAt(pts, upto * i / n));
  for (const [lw, cl] of [[w + 8, edge], [w, col]]) {
    x.beginPath(); path.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py));
    x.lineWidth = lw; x.strokeStyle = cl; x.lineJoin = 'round'; x.lineCap = 'butt'; x.stroke();
  }
}

// estado do mundo na etapa s com progresso k (0..1 dentro da cena)
const ETAPAS = ['buraco', 'vaza', 'concreto', 'cheia', 'camadas', 'dreno', 'bacteria', 'caminhao', 'final'];
function estado(s, k) {
  const at = (i, f) => s < i ? 0 : s > i ? 1 : ease(f(k));
  return {
    s, k,
    dig: at(0, k => k * 3.5),
    pipeIn: at(0, k => k * 3 - 0.5),
    plume: s === 1 ? ease(k * 1.5) : s === 2 ? 1 - ease(k * 2.5) : 0,
    well: s === 1 ? ease((k - 0.25) * 2.2) : s === 2 ? 1 - ease(k * 2) : 0,
    concrete: at(2, k => k * 2.5),
    fill: s <= 2 ? 0.1 + 0.12 * (s === 0 ? ease(k) : 1) : s === 3 ? 0.22 + 0.78 * ease(k * 1.4) : 0.9,
    overflow: s === 3 ? ease((k - 0.62) * 4) : s === 4 ? 1 - ease(k * 3) : 0,
    stink: s === 1 ? 0.5 * ease(k * 2) : s === 3 ? ease((k - 0.4) * 2) : s === 4 ? 1 - ease(k * 3) : 0,
    layers: at(4, k => k * 2.2),
    baffle: at(4, k => k * 3),
    outlet: at(4, k => k * 2.5 - 1.2),
    labels: s === 4 ? k : 0,
    drain: at(5, k => k * 2.5),
    drops: s < 5 ? 0 : s === 5 ? ease(k * 3 - 1.3) : 1,
    cleanDrops: at(6, k => k * 2),
    bact: s === 6 ? ease(k * 2) : s > 6 ? 0.6 : 0,
    truck: at(7, k => k * 2.2),
    hose: at(7, k => k * 3 - 1.4),
    sludge: s < 7 ? 0.3 : s === 7 ? lerp(0.3, 0.06, ease(k * 2 - 0.9)) : 0.06,
    final: s === 8 ? ease(k * 2) : 0,
  };
}

// ---------------- partes do desenho ----------------
function sky(t) {
  const g = x.createLinearGradient(0, 0, 0, G); g.addColorStop(0, PAL.sky0); g.addColorStop(1, PAL.sky1);
  x.fillStyle = g; x.fillRect(0, 0, W, G);
  x.fillStyle = '#ffe27a'; x.beginPath(); x.arc(880, 330, 62, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,226,122,0.25)'; x.beginPath(); x.arc(880, 330, 95, 0, 7); x.fill();
  for (let i = 0; i < 3; i++) {
    const cx = ((t * (14 + i * 6) + i * 420) % (W + 400)) - 200, cy = 300 + i * 70;
    x.fillStyle = 'rgba(255,255,255,0.9)';
    for (const [dx, dy, r] of [[0, 0, 42], [40, -14, 52], [86, 0, 40], [44, 12, 40]]) { x.beginPath(); x.arc(cx + dx, cy + dy, r, 0, 7); x.fill(); }
  }
}
function ground() {
  x.fillStyle = PAL.top; x.fillRect(0, G, W, 220);
  x.fillStyle = PAL.sub; x.fillRect(0, G + 220, W, WT0 - G - 220);
  x.fillStyle = PAL.rock; x.fillRect(0, WT1, W, H - WT1);
  // pedrinhas
  for (let i = 0; i < 70; i++) {
    const px = rnd(i * 3.1) * W, py = G + 30 + rnd(i * 7.7) * (WT0 - G - 40), r = 4 + rnd(i * 1.3) * 7;
    x.fillStyle = py < G + 220 ? '#7a4d31' : '#8e5d3a'; x.beginPath(); x.ellipse(px, py, r * 1.4, r, rnd(i) * 3, 0, 7); x.fill();
  }
  for (let i = 0; i < 40; i++) {
    const px = rnd(i * 5.3) * W, py = WT1 + 30 + rnd(i * 2.9) * 700, r = 10 + rnd(i * 4.1) * 22;
    x.fillStyle = '#4a3e37'; x.beginPath(); x.ellipse(px, py, r * 1.5, r, rnd(i * 9) * 3, 0, 7); x.fill();
  }
  x.fillStyle = PAL.grass; x.fillRect(0, G - 6, W, 26);
  x.fillStyle = PAL.grass2; x.fillRect(0, G + 14, W, 6);
}
function waterTable(t, dirt) {
  x.fillStyle = mixc([58, 155, 224], [120, 100, 60], dirt * 0.5);
  x.beginPath(); x.moveTo(0, WT1);
  for (let px = 0; px <= W; px += 20) x.lineTo(px, WT0 + Math.sin(px / 70 + t * 2) * 6);
  x.lineTo(W, WT1); x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 14; i++) { const px = (i * 83 + t * 30) % W; x.fillRect(px, WT0 + 30 + (i % 3) * 20, 34, 5); }
  x.font = `800 30px ${FONT}`; x.textAlign = 'left'; x.fillStyle = 'rgba(255,255,255,0.85)'; x.fillText('GROUNDWATER', 30, WT0 + 64);
}
function house() {
  x.fillStyle = PAL.cream; x.fillRect(70, 330, 260, 230);
  x.fillStyle = '#e05a47'; x.beginPath(); x.moveTo(45, 340); x.lineTo(200, 230); x.lineTo(355, 340); x.closePath(); x.fill();
  x.fillStyle = '#7a4a2e'; x.fillRect(110, 440, 60, 120);
  x.fillStyle = '#9fd8ff'; x.fillRect(200, 380, 70, 60); x.strokeStyle = PAL.cream; x.lineWidth = 5; x.strokeRect(200, 380, 70, 60);
  x.beginPath(); x.moveTo(235, 380); x.lineTo(235, 440); x.stroke();
  // vaso sanitario no canto
  x.fillStyle = '#fff'; x.strokeStyle = PAL.ink; x.lineWidth = 4;
  rr(270, 470, 34, 44, 6); x.fill(); x.stroke();
  x.beginPath(); x.ellipse(292, 520, 30, 12, 0, 0, 7); x.fill(); x.stroke();
}
function well(t, dirt) {
  // bomba manual
  x.fillStyle = '#6c7a89'; x.fillRect(WX0 - 10, G - 70, 70, 70);
  x.fillStyle = '#4b5663'; x.fillRect(WX0 + 15, G - 120, 20, 50);
  x.strokeStyle = '#4b5663'; x.lineWidth = 10; x.lineCap = 'round';
  x.beginPath(); x.moveTo(WX0 + 25, G - 115); x.lineTo(WX0 - 30, G - 140); x.stroke();
  // poco
  x.fillStyle = '#5a4636'; x.fillRect(WX0 - 8, G, WX1 - WX0 + 16, WT1 - G);
  x.fillStyle = mixc([58, 155, 224], PAL.waste, dirt); x.fillRect(WX0, WT0 - 20, WX1 - WX0, WT1 - WT0 + 20);
  x.fillStyle = '#2b2622'; x.fillRect(WX0, G, WX1 - WX0, WT0 - 20 - G);
  if (dirt > 0.6) pill(WX0 + 25, WT0 - 70, '☠', PAL.red, '#fff', 34, back((dirt - 0.6) * 3));
}
function holeShape(depth) {
  x.beginPath(); x.moveTo(TX0 - 6, G + 14);
  for (let i = 0; i <= 10; i++) x.lineTo(TX0 - 4 + Math.sin(i * 2.1) * 6, lerp(G + 14, depth, i / 10));
  for (let i = 0; i <= 10; i++) x.lineTo(lerp(TX0, TX1, i / 10), depth + Math.sin(i * 1.7) * 6);
  for (let i = 10; i >= 0; i--) x.lineTo(TX1 + 4 + Math.sin(i * 2.7) * 6, lerp(G + 14, depth, i / 10));
  x.closePath();
}
function tank(t, S) {
  const depth = lerp(G + 20, TY1, S.dig), wall = 24 * S.concrete;
  const ix0 = TX0 + wall, ix1 = TX1 - wall, iy1 = depth - wall, iy0 = TY0 + 10;
  // buraco
  x.fillStyle = '#3b2a1f'; holeShape(depth); x.fill();
  if (S.dig < 1) { // monte de terra crescendo
    x.fillStyle = '#7a4d31'; x.beginPath(); x.ellipse(TX1 + 90, G, 90 * S.dig, 60 * S.dig, 0, Math.PI, 0); x.fill();
  }
  // conteudo
  const h = iy1 - iy0, top = iy1 - h * S.fill;
  x.save(); x.beginPath(); x.rect(ix0, iy0 - 40, ix1 - ix0, iy1 - iy0 + 40); x.clip();
  if (S.layers < 1) {
    x.fillStyle = mixc(PAL.waste, PAL.waste, 0); x.fillRect(ix0, top, ix1 - ix0, iy1 - top);
  }
  if (S.layers > 0) {
    x.globalAlpha = S.layers;
    const sl = iy1 - h * S.sludge, sc = top + 34;
    x.fillStyle = mixc(PAL.liquid, PAL.liquid, 0); x.fillRect(ix0, top, ix1 - ix0, iy1 - top);
    x.fillStyle = mixc(PAL.scum, PAL.scum, 0); x.fillRect(ix0, top, ix1 - ix0, sc - top);
    x.fillStyle = mixc(PAL.sludge, PAL.sludge, 0);
    x.beginPath(); x.moveTo(ix0, iy1); for (let px = ix0; px <= ix1; px += 20) x.lineTo(px, sl + Math.sin(px / 25) * 5); x.lineTo(ix1, iy1); x.closePath(); x.fill();
    x.globalAlpha = 1;
  }
  // bolhas
  for (let i = 0; i < 8; i++) {
    const u = (t * 0.35 + i / 8) % 1, px = ix0 + 30 + rnd(i * 4) * (ix1 - ix0 - 60), py = lerp(iy1 - 10, top + 10, u);
    if (py > top) { x.fillStyle = 'rgba(255,255,255,0.25)'; x.beginPath(); x.arc(px, py, 5 + 3 * rnd(i), 0, 7); x.fill(); }
  }
  x.restore();
  // concreto
  if (S.concrete > 0) {
    x.save(); x.globalAlpha = clamp(S.concrete * 1.5);
    const off = (1 - S.concrete) * 60;
    x.fillStyle = PAL.concrete;
    x.fillRect(TX0 - off, TY0, 24, depth - TY0); x.fillRect(TX1 - 24 + off, TY0, 24, depth - TY0);
    x.fillRect(TX0, depth - 24 + off, TX1 - TX0, 24);
    // tampa
    x.fillStyle = PAL.concrete2; x.fillRect(TX0 - 12, TY0 - 30 - off * 3, TX1 - TX0 + 24, 30);
    x.fillStyle = '#6d727a'; x.fillRect((TX0 + TX1) / 2 - 40, TY0 - 46 - off * 3, 80, 18);
    x.fillStyle = 'rgba(0,0,0,0.12)'; for (let i = 0; i < 12; i++) x.fillRect(TX0 + rnd(i) * 280, TY0 + rnd(i * 3) * 300, 6, 6);
    x.restore();
  }
  // parede divisoria com passagem no meio
  if (S.baffle > 0) {
    const bx = TX0 + (TX1 - TX0) * 0.62, by1 = lerp(iy0, iy1, S.baffle);
    x.fillStyle = PAL.concrete;
    x.fillRect(bx - 10, iy0, 20, Math.min(by1, iy0 + h * 0.45) - iy0);
    if (by1 > iy0 + h * 0.62) x.fillRect(bx - 10, iy0 + h * 0.62, 20, by1 - iy0 - h * 0.62);
  }
  return { ix0, ix1, iy0, iy1, top };
}
function flow(t, pts, col, n = 4, speed = 0.45, r = 9) {
  for (let i = 0; i < n; i++) {
    const [px, py] = polyAt(pts, (t * speed + i / n) % 1);
    x.fillStyle = col; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
}
function plume(t, k) {
  if (k <= 0) return;
  x.save(); x.beginPath(); x.rect(0, G + 20, W, WT1 - G - 20); x.clip();
  const r = 80 + 560 * k, cx = (TX0 + TX1) / 2, cy = TY1 - 20;
  const g = x.createRadialGradient(cx, cy, 10, cx, cy, r);
  g.addColorStop(0, 'rgba(70,45,15,0.85)'); g.addColorStop(0.7, 'rgba(80,55,20,0.55)'); g.addColorStop(1, 'rgba(80,55,20,0)');
  x.fillStyle = g; x.beginPath();
  for (let a = 0; a <= 64; a++) { const an = a / 64 * Math.PI * 2, rr2 = r * (0.85 + 0.15 * Math.sin(an * 5 + t * 2)); x.lineTo(cx + Math.cos(an) * rr2 * 1.15, cy + Math.sin(an) * rr2 * 0.8); }
  x.fill(); x.restore();
}
function stink(t, k, cx, cy, n = 4) {
  if (k <= 0) return;
  x.save(); x.lineWidth = 9; x.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const u = (t * 0.6 + i / n) % 1, bx = cx + (i - (n - 1) / 2) * 60;
    x.strokeStyle = `rgba(120,200,60,${k * (1 - u) * 0.95})`;
    x.beginPath();
    for (let j = 0; j <= 12; j++) { const yy = cy - u * 160 - j * 9; x.lineTo(bx + Math.sin(j * 0.9 + t * 4 + i) * 14, yy); }
    x.stroke();
  }
  x.restore();
}
function drainField(t, S) {
  if (S.drain <= 0) return;
  x.save(); x.globalAlpha = clamp(S.drain * 1.4);
  const gx0 = 750, gx1 = 945, gy0 = 650, gy1 = 735, sy = (1 - S.drain) * 40;
  x.fillStyle = '#b9b1a5'; x.fillRect(gx0, gy0 + sy, gx1 - gx0, gy1 - gy0);
  for (let i = 0; i < 60; i++) { x.fillStyle = i % 2 ? '#8f877c' : '#d8d1c6'; x.beginPath(); x.arc(gx0 + 8 + rnd(i * 2.3) * (gx1 - gx0 - 16), gy0 + sy + 8 + rnd(i * 6.1) * (gy1 - gy0 - 16), 7 + rnd(i) * 5, 0, 7); x.fill(); }
  x.restore();
  pipe(PIPE_OUT, 18, S.outlet);
  if (S.drain > 0.5) for (let i = 0; i < 8; i++) { x.fillStyle = PAL.ink; x.beginPath(); x.arc(775 + i * 21, 690, 3.5, 0, 7); x.fill(); }
}
function drops(t, S) {
  if (S.drops <= 0) return;
  const col = mixc(PAL.liquid, PAL.clean, S.cleanDrops);
  for (let i = 0; i < 14; i++) {
    const u = (t * 0.5 + rnd(i * 3.3)) % 1, px = 770 + (i % 8) * 22 + Math.sin(u * 8 + i) * 6, py = lerp(700, WT0, u);
    x.globalAlpha = S.drops * (u < 0.9 ? 1 : (1 - u) * 10);
    x.fillStyle = col; x.beginPath(); x.moveTo(px, py - 14); x.quadraticCurveTo(px + 9, py, px, py + 6); x.quadraticCurveTo(px - 9, py, px, py - 14); x.fill();
  }
  x.globalAlpha = 1;
}
function bacteria(t, k) {
  if (k <= 0) return;
  for (let i = 0; i < 16; i++) {
    const px = 760 + rnd(i * 1.7) * 180 + Math.sin(t * 2 + i) * 8, py = 760 + rnd(i * 8.1) * 200 + Math.cos(t * 1.7 + i) * 8;
    x.save(); x.translate(px, py); x.rotate(rnd(i) * 3 + Math.sin(t * 3 + i) * 0.3); x.scale(back(k * 1.3 - rnd(i) * 0.3), back(k * 1.3 - rnd(i) * 0.3));
    x.fillStyle = '#7ee05a'; x.strokeStyle = '#2d7a1e'; x.lineWidth = 3;
    rr(-16, -8, 32, 16, 8); x.fill(); x.stroke();
    x.fillStyle = PAL.ink; x.beginPath(); x.arc(-5, -1, 2.5, 0, 7); x.arc(5, -1, 2.5, 0, 7); x.fill();
    x.restore();
  }
}
function truck(t, S) {
  if (S.truck <= 0) return;
  const tx = lerp(W + 40, 470, S.truck), ty = G - 10;
  // mangueira
  if (S.hose > 0) {
    x.strokeStyle = '#222'; x.lineWidth = 14; x.lineCap = 'round';
    x.beginPath(); x.moveTo(tx + 20, ty - 70);
    const ex = lerp(tx + 20, (TX0 + TX1) / 2, S.hose), ey = lerp(ty - 70, TY0 - 40, S.hose);
    x.quadraticCurveTo(tx - 40, ty - 120, ex, ey); x.stroke();
  }
  x.fillStyle = '#f2b632'; rr(tx, ty - 150, 250, 110, 40); x.fill();
  x.fillStyle = '#d99a1c'; x.fillRect(tx + 20, ty - 100, 210, 10);
  x.fillStyle = '#2f6fd1'; rr(tx + 250, ty - 130, 100, 90, 14); x.fill();
  x.fillStyle = '#bfe6ff'; rr(tx + 285, ty - 118, 52, 38, 6); x.fill();
  x.fillStyle = '#333'; x.fillRect(tx - 5, ty - 45, 360, 14);
  for (const wx of [tx + 50, tx + 190, tx + 300]) {
    x.fillStyle = '#222'; x.beginPath(); x.arc(wx, ty - 22, 26, 0, 7); x.fill();
    x.fillStyle = '#999'; x.beginPath(); x.arc(wx, ty - 22, 10, 0, 7); x.fill();
  }
  x.font = `900 30px ${FONT}`; x.fillStyle = PAL.ink; x.textAlign = 'center'; x.fillText('SEPTIC PUMP', tx + 125, ty - 115);
}
function labels(t, S, geo) {
  if (S.labels <= 0) return;
  const h = geo.iy1 - geo.iy0, cx = (TX0 + TX1) / 2 - 30;
  const L = [['GREASE', geo.top + 17, PAL.yellow], ['LIQUID', (geo.top + geo.iy1 - h * S.sludge) / 2, '#ffffff'], ['SOLIDS', geo.iy1 - h * S.sludge / 2, '#f0c8a0']];
  L.forEach(([txt, y, bg], i) => pill(cx, y, txt, bg, PAL.ink, 30, back((S.labels - 0.3 - i * 0.12) * 5)));
}
function confetti(t) {
  const d = E.since(t, 'tada'); if (d < 0 || d > 3) return;
  for (let i = 0; i < 90; i++) {
    const vx = (rnd(i * 2.2) - 0.5) * 900, vy = -500 - rnd(i * 5.5) * 700;
    const px = W / 2 + vx * d, py = 460 + vy * d + 700 * d * d;
    x.save(); x.translate(px, py); x.rotate(d * 8 + i);
    x.fillStyle = [PAL.yellow, PAL.red, PAL.green, '#3a9be0', '#ff8ad8'][i % 5]; x.fillRect(-9, -5, 18, 10);
    x.restore();
  }
}

// ---------------- HUD: etapa e veredito ----------------
function hud(t, p, S, lt) {
  if (p.titulo) {
    const k = back(S.final * 1.2);
    x.save(); x.translate(W / 2, 260); x.scale(k, k);
    x.font = `900 92px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineWidth = 18; x.strokeStyle = PAL.ink; x.lineJoin = 'round';
    x.strokeText(p.titulo[0], 0, -60); x.fillStyle = '#fff'; x.fillText(p.titulo[0], 0, -60);
    x.font = `900 112px ${FONT}`; x.strokeText(p.titulo[1], 0, 50); x.fillStyle = PAL.yellow; x.fillText(p.titulo[1], 0, 50);
    x.restore();
    return;
  }
  if (p.passo) pill(W / 2, 130, `STEP ${p.passo}`, PAL.ink, '#fff', 44, 1 + 0.15 * Math.max(0, 1 - (t - E.cena0) * 4));
  const verd = (tipo, txt, bg, ico) => {
    const d = E.since(t, tipo); if (d < 0 || t > E.cena1 + 0.1) return;
    pill(W / 2, 228, `${ico} ${txt}`, bg, '#fff', 38, back(d * 4));
  };
  if (p.ruim) verd('erro', p.ruim, PAL.red, '✗');
  if (p.bom) verd('certo', p.bom, PAL.green, '✓');
}

// ---------------- legenda ----------------
function subtitle(t) {
  const s = ST.segs.find(s => t >= s.t0 - 0.05 && t <= s.t1 + 0.25);
  if (!s) return;
  const words = s.text.split(' ').filter(Boolean), chunks = [], ini = [];
  for (let i = 0; i < words.length;) { let n = 0, len = 0; while (i + n < words.length && (n < 2 || len < 14) && n < 4) { len += words[i + n].length + 1; n++; if (/[.?!…:,]$/.test(words[i + n - 1])) break; } chunks.push(words.slice(i, i + n).join(' ')); ini.push(i); i += n; }
  let cur = chunks[chunks.length - 1];
  if (s.w && s.w.length === words.length) {
    let k = 0; for (let i = 0; i < words.length; i++) if (s.w[i] <= t + 0.1) k = i;
    for (let c = 0; c < chunks.length; c++) if (ini[c] <= k) cur = chunks[c];
  } else {
    const total = chunks.reduce((a, b) => a + b.length, 0), pp = (t - s.t0) / (s.t1 - s.t0) * total;
    let acc = 0; for (const ch of chunks) { acc += ch.length; if (pp <= acc) { cur = ch; break; } }
  }
  x.font = `900 80px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lines = []; let line = '';
  for (const w of cur.split(' ')) { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > W - 300 && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  lines.forEach((l, i) => {
    // zona segura do Shorts: rodape cobre de ~72% para baixo e os botoes ficam na direita
    const y = H * 0.63 + i * 94, cx = W / 2 - 50;
    x.lineWidth = 16; x.strokeStyle = '#000'; x.lineJoin = 'round'; x.strokeText(l.toUpperCase(), cx, y);
    x.fillStyle = RX && RX.test(l) ? PAL.yellow : '#ffffff'; x.fillText(l.toUpperCase(), cx, y);
  });
}

// ---------------- cenas ----------------
const COMP = {};
COMP.fossa = (t, lt, p) => {
  const S = estado(Math.max(0, ETAPAS.indexOf(p.etapa)), lt);
  sky(t); ground(); waterTable(t, S.well);
  plume(t, S.plume);
  bacteria(t, S.bact);
  drops(t, S);
  drainField(t, S);
  house();
  pipe(PIPE_IN, 20, S.pipeIn);
  if (S.pipeIn >= 1) flow(t, PIPE_IN, mixc(PAL.waste, PAL.waste, 0));
  const geo = tank(t, S);
  if (S.outlet >= 1) flow(t, PIPE_OUT, mixc(PAL.liquid, PAL.clean, S.cleanDrops), 3, 0.4, 7);
  well(t, S.well);
  if (S.overflow > 0) {
    x.fillStyle = mixc(PAL.waste, PAL.waste, 0);
    x.beginPath(); x.ellipse((TX0 + TX1) / 2, G - 4, 230 * S.overflow, 22 * S.overflow, 0, 0, 7); x.fill();
  }
  stink(t, S.stink, (TX0 + TX1) / 2, G - 30);
  truck(t, S);
  labels(t, S, geo);
  hud(t, p, S, lt);
};
COMP.texto = (t, lt, p) => {
  x.fillStyle = PAL.ink; x.fillRect(0, 0, W, H);
  const L = p.lineas || [];
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `900 110px ${FONT}`; x.fillStyle = PAL.yellow; x.fillText(L[0] || '', W / 2, H * 0.38);
  x.font = `800 60px ${FONT}`; x.fillStyle = '#fff'; x.fillText(L[1] || '', W / 2, H * 0.38 + 120);
};

function sceneAt(t) { let i = 0; for (let k = 0; k < ST.cenas.length; k++) if (t >= ST.cenas[k].t0) i = k; return i; }
function drawScene(i, t) {
  const sc = ST.cenas[i], p = sc.p || {}, t1 = i + 1 < ST.cenas.length ? ST.cenas[i + 1].t0 : ST.dur, lt = clamp((t - sc.t0) / Math.max(0.1, t1 - sc.t0));
  E.cena0 = sc.t0; E.cena1 = t1;
  const shake = E.pulse(t, 'erro', 0.4) * 18;
  const zoom = 1 + (p.zoom ?? 0.02) * lt, fy = (p.fy ?? 0.4) * H;
  x.save();
  x.translate(W / 2 + (rnd(t * 97) - 0.5) * shake, fy + (rnd(t * 71) - 0.5) * shake); x.scale(zoom, zoom); x.translate(-W / 2, -fy);
  (COMP[sc.comp] || COMP.texto)(t, lt, p);
  x.restore();
}
window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
  const g = ST.gancho;
  if (g && t < g.dur) drawScene(g.cena, g.t); else drawScene(sceneAt(t), t);
  const er = E.pulse(t, 'erro', 0.25); if (er > 0) { x.fillStyle = `rgba(255,60,40,${0.3 * er})`; x.fillRect(0, 0, W, H); }
  const ok = E.pulse(t, 'certo', 0.25); if (ok > 0) { x.fillStyle = `rgba(60,220,110,${0.18 * ok})`; x.fillRect(0, 0, W, H); }
  confetti(t);
  subtitle(t);
  if (t > ST.dur - 0.5) { x.fillStyle = `rgba(0,0,0,${clamp((t - ST.dur + 0.5) / 0.5)})`; x.fillRect(0, 0, W, H); }
};
window.setup = h => {
  ST = h;
  RX = h.destaque && h.destaque.length ? new RegExp(h.destaque.join('|'), 'i') : null;
};
