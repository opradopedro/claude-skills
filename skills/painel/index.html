<title>Painel dos canais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mesa de controle. Seletor de conta grande no topo (cada canal com a sua cor), abas fixas e grade de cards 9:16 que vira coluna no celular. A aba Ideias é um chat. */
:root {
  --bg: #f3f2ee; --panel: #ffffff; --sunk: #e9e7e1; --line: #d9d6ce; --fg: #1c1b19; --muted: #6a675f;
  --ok: #23804f; --warn: #a06a0e; --bad: #b8322f;
  --hm: #b8322f; --gta: #a8830a; --yb: #2a63b8;
  --acc: var(--hm); --on-acc: #fff;
  --display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --body: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121316; --panel: #1b1d22; --sunk: #0d0e10; --line: #2c2f37; --fg: #eeece6; --muted: #9a9ca6;
  --ok: #4cc488; --warn: #e2a93b; --bad: #ff6a64; --hm: #e0453f; --gta: #ffd21f; --yb: #5b9cff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121316; --panel: #1b1d22; --sunk: #0d0e10; --line: #2c2f37; --fg: #eeece6; --muted: #9a9ca6;
  --ok: #4cc488; --warn: #e2a93b; --bad: #ff6a64; --hm: #e0453f; --gta: #ffd21f; --yb: #5b9cff; color-scheme: dark }
body[data-canal="hm"] { --acc: var(--hm); --on-acc: #fff; }
body[data-canal="gta"] { --acc: var(--gta); --on-acc: #15130a; }
body[data-canal="yb"] { --acc: var(--yb); --on-acc: #fff; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; }
.topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.topo h1 { font: 800 15px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.topo small { font: 500 12px var(--mono); color: var(--muted); }
.contas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.conta { text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; font: inherit; }
.conta b { font: 800 clamp(20px, 4.4vw, 30px)/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.conta span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conta em { font: 500 11px var(--mono); font-style: normal; color: var(--muted); }
.conta[data-c="hm"] b { color: var(--hm); } .conta[data-c="gta"] b { color: var(--gta); } .conta[data-c="yb"] b { color: var(--yb); }
.conta[aria-pressed="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 6px; padding-block: 12px; margin-top: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { font: 600 14px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--on-acc); background: var(--acc); border-color: var(--acc); }
nav button i { font-style: normal; font: 500 11px var(--mono); margin-left: 4px; opacity: .8; }
button:focus-visible, textarea:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.aviso { color: var(--muted); font-size: 13px; margin: 12px 0 0; max-width: 70ch; }
.grupo { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
.grupo h2 { font: 800 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.media { background: #000; aspect-ratio: 9 / 16; max-width: 100%; max-height: 460px; display: flex; align-items: center; justify-content: center; }
.media video { width: 100%; height: 100%; object-fit: contain; display: block; }
.media p { color: #b9b6ad; font-size: 13px; text-align: center; padding: 20px; margin: 0; }
.info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.tit { font-weight: 700; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11px var(--mono); background: var(--sunk); color: var(--muted); border-radius: 999px; padding: 3px 9px; text-decoration: none; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.acc { color: var(--acc); }
a.chip { color: var(--fg); }
.quando { font: 500 13px var(--mono); color: var(--acc); font-variant-numeric: tabular-nums; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; color: var(--fg); }
details ol { margin: 6px 0 0; padding-left: 20px; }
details p { white-space: pre-line; margin: 6px 0 0; overflow-wrap: anywhere; }
.numeros { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.numeros b { color: var(--fg); font-weight: 500; }
.linha { display: flex; gap: 8px; }
.btn { flex: 1; font: 600 14px var(--body); padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; min-height: 38px; }
.btn[aria-pressed="true"].sim { border-color: var(--ok); color: var(--ok); }
.btn[aria-pressed="true"].nao { border-color: var(--bad); color: var(--bad); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--on-acc); flex: none; }
.btn:disabled { opacity: .5; cursor: default; }
textarea { width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: 14px var(--body); }
.pedidos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.pedidos li { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
.pedidos li small { color: var(--muted); display: block; }
.pedidos li.feito { opacity: .65; }
.status { font-size: 12px; color: var(--muted); margin: 0; min-height: 1em; }
.vazio { color: var(--muted); padding: 28px 0; }
.sobre { max-width: 70ch; margin-top: 18px; display: flex; flex-direction: column; gap: 18px; }
.sobre h2 { font: 800 22px var(--display); text-transform: uppercase; margin: 0 0 4px; color: var(--acc); }
.sobre p, .sobre li { margin: 0; }
.sobre ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
/* Ideias: chat */
.chat { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; max-width: 760px; }
.msg { align-self: flex-end; max-width: min(560px, 92%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 4px 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .imgs { display: flex; flex-wrap: wrap; gap: 6px; }
.msg .imgs img { width: 120px; max-width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; background: var(--sunk); }
.msg footer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 500 11px var(--mono); color: var(--muted); }
.resp { align-self: flex-start; max-width: min(560px, 92%); background: var(--sunk); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.resp b { display: block; font: 500 11px var(--mono); color: var(--acc); margin-bottom: 2px; }
.mini { background: none; border: 0; color: var(--muted); font: 500 11px var(--mono); cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.compor { position: sticky; bottom: 0; background: var(--bg); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin-top: 16px; max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
.compor .linha { align-items: flex-end; }
.compor textarea { min-height: 48px; max-height: 40vh; }
.anexos { display: flex; flex-wrap: wrap; gap: 6px; }
.anexos span { position: relative; }
.anexos img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; display: block; }
.anexos button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; font-size: 12px; line-height: 1; }
.clip { flex: none; width: 44px; min-height: 44px; font-size: 18px; }
.drop { outline: 2px dashed var(--acc); outline-offset: 4px; }
/* Modo lista */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.barra .btn { flex: none; }
.barra .btn[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
.barra .baixar { margin-left: auto; }
.barra p { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
.barra p:empty { display: none; }
.lista { display: flex; flex-direction: column; margin-top: 8px; }
.row { display: grid; grid-template-columns: 26px 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.row:has(input:checked) { background: var(--sunk); }
.row input { width: 22px; height: 22px; accent-color: var(--acc); margin: 0; cursor: pointer; }
.row img, .row .sem { width: 48px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 6px; background: var(--sunk); display: block; }
.row .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; text-align: left; color: var(--fg); font: inherit; cursor: pointer; }
.row .txt b { font-weight: 600; font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .txt small { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row .txt small .ok { color: var(--ok); } .row .txt small .warn { color: var(--warn); }
.row .btn { flex: none; padding: 6px 10px; }
.aberto { padding-block: 10px 16px; border-bottom: 1px solid var(--line); max-width: 420px; }
[hidden] { display: none !important; }
/* Celular: abas viram barra de app embaixo */
@media (max-width: 700px) {
  nav { position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 20; margin: 0; gap: 4px; border-bottom: 0; border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav button { flex: 1; border: 0; border-radius: 10px; padding: 9px 2px; font-size: 13px; white-space: normal; line-height: 1.15; }
  .wrap { padding-block-end: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .compor { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  .grade { grid-template-columns: 1fr; }
  .media { max-height: 70vh; }
}
@media (max-width: 560px) { .contas { grid-template-columns: 1fr 1fr 1fr; gap: 6px; } .conta { padding: 10px; } .conta span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <div class="topo"><h1>Painel dos canais</h1><small id="atualizado">carregando…</small></div>
  <div class="contas" role="group" aria-label="Conta">
    <button type="button" class="conta" data-c="hm" aria-pressed="true"><b>Hora Muerta</b><span>YouTube · espanhol · terror</span><em data-n="hm">–</em></button>
    <button type="button" class="conta" data-c="gta" aria-pressed="false"><b>Radar GTA VI</b><span>@radar.gta6br · Instagram + Shorts</span><em data-n="gta">–</em></button>
    <button type="button" class="conta" data-c="yb" aria-pressed="false"><b>So You Built It</b><span>@SoYouBuiltIt · YouTube · inglês</span><em data-n="yb">–</em></button>
  </div>
  <nav role="tablist" aria-label="Seções">
    <button role="tab" data-aba="prox" aria-selected="true">A postar<i data-q="prox"></i></button>
    <button role="tab" data-aba="post" aria-selected="false">Postados<i data-q="post"></i></button>
    <button role="tab" data-aba="ideias" aria-selected="false">Ideias<i data-q="ideias"></i></button>
    <button role="tab" data-aba="como" aria-selected="false">Como funciona</button>
  </nav>
  <p class="aviso" id="aviso"></p>
  <div class="barra" id="barra">
    <button type="button" class="btn" id="modo-lista" aria-pressed="true">☰ Lista</button>
    <button type="button" class="btn" id="modo-grade" aria-pressed="false">▦ Grade</button>
    <button type="button" class="btn" id="sel-todos">Selecionar todos</button>
    <button type="button" class="btn pri baixar" id="baixar-sel" disabled>Baixar selecionados</button>
    <p id="progresso" aria-live="polite"></p>
  </div>
  <section id="prox" role="tabpanel"></section>
  <section id="post" role="tabpanel" hidden></section>
  <section id="ideias" role="tabpanel" hidden>
    <div class="chat" id="chat"></div>
    <form class="compor" id="compor">
      <div class="anexos" id="anexos"></div>
      <div class="linha">
        <button type="button" class="btn clip" id="anexar" title="Anexar print" aria-label="Anexar print">📎</button>
        <input type="file" id="arquivo" accept="image/*" multiple hidden>
        <textarea id="texto" placeholder="Cole um link de Reel ou Shorts, mande um print ou só escreva a ideia…"></textarea>
        <button type="submit" class="btn pri" id="enviar">Enviar</button>
      </div>
      <p class="status" id="st-ideia"></p>
    </form>
  </section>
  <section id="como" role="tabpanel" class="sobre" hidden></section>
</div>

<script>
const CANAIS = {
  hm: { nome: "Hora Muerta", sobre: `
    <div><h2>Rotina</h2><ul>
      <li>Todo dia às 15h41 a tarefa produz o próximo episódio e agenda no YouTube como privado, para sair às 21h de Brasília.</li>
      <li>Toda história tem no mínimo 2 partes. A parte 1 termina no pior momento e avisa quando sai a próxima.</li>
      <li>Voz Gemini (Algenib), animação em código, piano grave. Se o Gemini falhar, o vídeo do dia não sobe.</li></ul></div>
    <div><h2>Pedidos e ideias</h2><ul>
      <li>Antes de produzir, a rotina lê os pedidos abertos e as ideias novas deste canal.</li>
      <li>Card sem vídeo ainda é só roteiro: dá para pedir mudança no texto antes de virar vídeo.</li></ul></div>` },
  gta: { nome: "Radar GTA VI", sobre: `
    <div><h2>Rotina</h2><ul>
      <li>3 Reels por dia no @radar.gta6br (12h, 18h e 21h). A tarefa acorda 10 minutos antes, publica e espelha nos Shorts.</li>
      <li>Assunto: notícias das últimas 48 h com fonte, virais da gringa (só o tema, nunca o vídeo) e atemporais nos dias fracos.</li>
      <li>Imagens só do material oficial da Rockstar. Voz Orus do Gemini, legenda amarela.</li></ul></div>
    <div><h2>Pedidos e ideias</h2><ul>
      <li>Avaliar é opcional: os vídeos saem no horário mesmo sem nota.</li>
      <li>Um pedido num vídeo da fila muda o vídeo antes de ele sair.</li></ul></div>` },
  yb: { nome: "So You Built It", sobre: `
    <div><h2>Rotina</h2><ul>
      <li>2 Shorts por dia em inglês: uma Curiosidade (17h de Nova York) e uma Evolução “You built a…” (19h de Nova York).</li>
      <li>3D semirrealista em código, voz Gemini (Charon), uma palavra de legenda por vez, sem música.</li></ul></div>
    <div><h2>Pedidos e ideias</h2><ul>
      <li>A produção lê os pedidos abertos e as ideias novas antes de escrever o próximo roteiro.</li></ul></div>` },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = iso => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const hojeDia = () => new Date().toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });

let canal = "hm", aba = "prox";
let docs = {}, pedidos = [], votos = {}, ideias = [], db = null, user = null, eu = null, assets = null, dl = null, sample = null;
const rascunhos = {};
let modo = "lista";
const sel = new Set(), expandidos = new Set();
try { const c = localStorage.getItem("canal"); if (CANAIS[c]) canal = c; const a = localStorage.getItem("aba"); if (a) aba = a; const m = localStorage.getItem("modo"); if (m === "grade" || m === "lista") modo = m; } catch (e) {}
if (CANAIS[location.hash.slice(1)]) canal = location.hash.slice(1);

const noAr = it => it.estado === "postado" || ((it.estado === "agendado") && it.quando && new Date(it.quando) <= new Date());
function estado(it) {
  if (noAr(it)) return ["no ar", "ok"];
  if (it.estado === "agendado") return ["agendado", "warn"];
  if (it.video) return ["pronto, não subiu", "warn"];
  return ["só roteiro", ""];
}
function itensDe(c) { return (docs[c]?.itens || []).slice(); }
function listas(c) {
  const it = itensDe(c);
  const t = i => i.quando || "9999";
  return { prox: it.filter(i => !noAr(i)).sort((a, b) => t(a).localeCompare(t(b))), post: it.filter(noAr).sort((a, b) => t(b).localeCompare(t(a))) };
}

function card(it) {
  const [est, cls] = estado(it);
  const k = canal + "_" + it.codigo;
  const meu = votos[k + "_" + eu]?.nota;
  const contar = n => Object.values(votos).filter(v => v.canal === canal && v.codigo === it.codigo && v.nota === n).length;
  const ps = pedidos.filter(p => p.canal === canal && p.codigo === it.codigo).sort((a, b) => (a.criado || "").localeCompare(b.criado || ""));
  const media = it.video
    ? `<video controls playsinline preload="none" ${it.capa ? `poster="${esc(it.capa)}"` : ""} src="${esc(it.video)}"></video>`
    : `<p>Vídeo ainda não produzido.<br>O roteiro está abaixo.</p>`;
  const n = it.numeros;
  return `<article class="card" data-k="${esc(it.codigo)}">
    <div class="media">${media}</div>
    <div class="info">
      ${it.quando ? `<span class="quando">${esc(fmt(it.quando))}</span>` : ""}
      <p class="tit">${esc(it.titulo)}</p>
      <div class="chips"><span class="chip">${esc(it.codigo)}</span>${it.partes > 1 ? `<span class="chip">parte ${it.parte}/${it.partes}</span>` : ""}<span class="chip ${cls}">${est}</span>
        ${(it.links || []).map(l => `<a class="chip" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nome)} ↗</a>`).join("")}</div>
      ${n ? `<div class="numeros">${n.views != null ? `<span><b>${Number(n.views).toLocaleString("pt-BR")}</b> views</span>` : ""}${n.curtidas != null ? `<span><b>${n.curtidas}</b> curtidas</span>` : ""}${n.pulos != null ? `<span><b>${n.pulos}%</b> pularam</span>` : ""}</div>` : ""}
      ${it.roteiro?.length ? `<details><summary>Roteiro (${it.roteiro.length} frases)</summary><ol>${it.roteiro.map(l => `<li>${esc(l)}</li>`).join("")}</ol></details>` : ""}
      ${it.legenda ? `<details><summary>Legenda</summary><p>${esc(it.legenda)}</p></details>` : ""}
      ${it.video && dl ? `<button type="button" class="btn" data-baixar>⬇ Baixar vídeo</button>` : ""}
      ${db ? `<div class="linha">
        <button type="button" class="btn sim" data-v="sim" aria-pressed="${meu === "sim"}">👍 Gostei${contar("sim") ? " · " + contar("sim") : ""}</button>
        <button type="button" class="btn nao" data-v="nao" aria-pressed="${meu === "nao"}">👎 Não gostei${contar("nao") ? " · " + contar("nao") : ""}</button></div>
      ${ps.length ? `<ul class="pedidos">${ps.map(p => `<li class="${p.status !== "aberto" ? "feito" : ""}">${esc(p.texto)}<small>${p.status === "aberto" ? "aberto" : esc(p.status) + (p.resposta ? ": " + esc(p.resposta) : "")} · ${p.criado ? new Date(p.criado).toLocaleDateString("pt-BR") : ""}</small></li>`).join("")}</ul>` : ""}
      <textarea id="ped-${esc(canal + it.codigo)}" placeholder="Pedir mudança neste vídeo (texto, voz, cena, trocar o tema…)">${esc(rascunhos[k] || "")}</textarea>
      <div class="linha" style="justify-content:flex-end"><button type="button" class="btn pri" data-p>Enviar pedido</button></div>
      <p class="status"></p>` : ""}
    </div></article>`;
}

function linha(it) {
  const k = canal + "_" + it.codigo, [est, cls] = estado(it), ab = expandidos.has(k);
  return `<div class="row" data-k="${esc(it.codigo)}">
    <input type="checkbox" data-sel ${sel.has(k) ? "checked" : ""} ${it.video ? "" : "disabled"} aria-label="Selecionar ${esc(it.titulo)}">
    ${it.capa ? `<img src="${esc(it.capa)}" alt="" loading="lazy">` : `<span class="sem"></span>`}
    <button type="button" class="txt" data-abrir aria-expanded="${ab}"><small>${it.quando ? esc(fmt(it.quando)) + " · " : ""}<span class="${cls}">${est}</span></small><b>${esc(it.titulo)}</b></button>
    ${it.video && dl ? `<button type="button" class="btn" data-baixar-um aria-label="Baixar ${esc(it.titulo)}">⬇</button>` : ""}
  </div>${ab ? `<div class="aberto">${card(it)}</div>` : ""}`;
}
const visiveis = () => (listas(canal)[aba] || []).filter(i => i.video);
function atualizarBarra() {
  const vis = visiveis(), n = vis.filter(i => sel.has(canal + "_" + i.codigo)).length;
  $("#baixar-sel").disabled = n === 0;
  $("#baixar-sel").textContent = n ? `Baixar ${n} selecionado${n > 1 ? "s" : ""}` : "Baixar selecionados";
  $("#sel-todos").textContent = vis.length && n === vis.length ? "Limpar seleção" : "Selecionar todos";
}
let baixando = false;
async function baixar(lista) {
  const prog = $("#progresso");
  if (baixando || !lista.length) return;
  if (!dl) { prog.textContent = "Baixar só funciona com a página aberta logada no Claude."; return; }
  baixando = true; $("#baixar-sel").disabled = true;
  let ok = 0;
  for (const [n, it] of lista.entries()) {
    const pre = lista.length > 1 ? `${n + 1} de ${lista.length}: ` : "";
    try {
      prog.textContent = `${pre}preparando ${it.titulo}…`;
      const r = await fetch(it.video);
      if (!r.ok) throw { code: "fetch" };
      const blob = await r.blob();
      prog.textContent = `${pre}confirme o download na janela que abriu.`;
      await dl.save({ filename: `${canal}_${it.codigo}.mp4`, data: blob });
      ok++; sel.delete(canal + "_" + it.codigo);
      document.querySelectorAll(`.row[data-k="${CSS.escape(it.codigo)}"] [data-sel]`).forEach(c => c.checked = false);
    } catch (e) {
      const c = e && e.code;
      if (c === "declined") { prog.textContent = `${pre}cancelado.`; continue; }
      if (c === "rate_limited") { prog.textContent = "Já tem uma confirmação aberta. Responda ela e tente de novo."; break; }
      if (c === "fetch") { prog.textContent = `${pre}não consegui carregar o vídeo.`; continue; }
      prog.textContent = "O download não está disponível nesta tela. Tente pelo app do Claude ou pelo navegador."; break;
    }
  }
  if (ok) prog.textContent = ok === 1 ? "1 vídeo baixado." : `${ok} vídeos baixados.`;
  baixando = false; atualizarBarra();
}
document.addEventListener("change", e => {
  if (!e.target.matches("[data-sel]")) return;
  const k = canal + "_" + e.target.closest(".row").dataset.k;
  e.target.checked ? sel.add(k) : sel.delete(k);
  atualizarBarra();
});

let pend = false;
document.addEventListener("pause", () => { if (pend) render(); }, true);
function render() {
  if ([...document.querySelectorAll("video")].some(v => !v.paused)) { pend = true; return; }
  pend = false;
  document.body.dataset.canal = canal;
  document.querySelectorAll(".conta").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === canal));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === aba));
  ["prox", "post", "ideias", "como"].forEach(id => $("#" + id).hidden = id !== aba);
  for (const c of Object.keys(CANAIS)) {
    const l = listas(c), abertos = pedidos.filter(p => p.canal === c && p.status === "aberto").length;
    $(`[data-n="${c}"]`).textContent = docs[c] ? `${l.prox.length} a postar · ${l.post.length} no ar${abertos ? ` · ${abertos} pedido${abertos > 1 ? "s" : ""}` : ""}` : "sem dados ainda";
  }
  const l = listas(canal);
  $('[data-q="prox"]').textContent = l.prox.length || "";
  $('[data-q="post"]').textContent = l.post.length || "";
  const novas = ideias.filter(i => i.canal === canal && (i.status || "nova") === "nova").length;
  $('[data-q="ideias"]').textContent = novas || "";
  const d = docs[canal];
  $("#atualizado").textContent = d?.atualizado ? `${CANAIS[canal].nome} atualizado ${fmt(d.atualizado)}` : "";
  $("#aviso").textContent = !db ? "Abra esta página logado no Claude para ver os vídeos, votar, pedir mudanças e mandar ideias."
    : aba === "ideias" ? "Mande como se fosse no chat: link de Reel, Shorts ou TikTok, print ou texto. A produção lê as ideias novas deste canal antes de escolher o próximo tema."
    : aba === "como" ? "" : "Votar é opcional. Pedido aberto é lido pela produção antes do próximo vídeo e volta marcado como feito, com uma resposta.";
  for (const id of ["prox", "post"]) {
    const el = $("#" + id);
    el.querySelectorAll("textarea").forEach(t => rascunhos[canal + "_" + t.closest(".card").dataset.k] = t.value);
    const lista = l[id];
    if (!lista.length) { el.innerHTML = `<p class="vazio">${!d ? "Este canal ainda não mandou vídeos para cá. Eles aparecem depois da próxima produção." : id === "post" ? "Nenhum vídeo no ar ainda." : "Nada na fila agora. O próximo aparece aqui quando a produção rodar."}</p>`; continue; }
    const grupos = [];
    lista.forEach(it => {
      const g = it.serie ? it.serie : (it.quando ? new Date(it.quando).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" }) : "Sem data");
      let s = grupos.find(x => x.id === g);
      if (!s) grupos.push(s = { id: g, t: it.serie ? (it.serie_titulo || it.serie) : (g === hojeDia() ? "Hoje" : g), itens: [] });
      s.itens.push(it);
    });
    el.innerHTML = modo === "lista" ? `<div class="lista">${lista.map(linha).join("")}</div>`
      : grupos.map(s => `<div class="grupo"><h2>${esc(s.t)} <span class="chip">${s.itens.length} vídeo${s.itens.length > 1 ? "s" : ""}</span></h2>
      <div class="grade">${s.itens.map(card).join("")}</div></div>`).join("");
  }
  $("#barra").hidden = !(aba === "prox" || aba === "post") || !d;
  $("#modo-lista").setAttribute("aria-pressed", modo === "lista");
  $("#modo-grade").setAttribute("aria-pressed", modo === "grade");
  $("#sel-todos").hidden = $("#baixar-sel").hidden = modo !== "lista" || !dl;
  atualizarBarra();
  $("#como").innerHTML = CANAIS[canal].sobre;
  renderChat();
}

/* ---------- Ideias ---------- */
const LINK = /https?:\/\/[^\s<>"]+/g;
function tipoLink(u) {
  if (/instagram\.com\/(reel|reels|p)\//.test(u)) return "Reel do Instagram";
  if (/youtube\.com\/shorts|youtu\.be/.test(u)) return "YouTube";
  if (/tiktok\.com/.test(u)) return "TikTok";
  return "link";
}
const ROT = { nova: "nova", anotada: "anotada", usada: "virou vídeo", descartada: "descartada" };
function renderChat() {
  const lista = ideias.filter(i => i.canal === canal).sort((a, b) => (a.criado || "").localeCompare(b.criado || ""));
  const el = $("#chat");
  const fim = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = lista.length ? lista.map(i => `
    <div class="msg" data-id="${esc(i.id)}">
      ${i.texto ? `<p>${esc(i.texto).replace(LINK, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}</p>` : ""}
      ${i.imagens?.length ? `<div class="imgs">${i.imagens.map(m => `<a href="${esc(m.url || "/_blob/" + m.id)}" target="_blank" rel="noopener"><img src="${esc(m.url || "/_blob/" + m.id)}" alt="print enviado"></a>`).join("")}</div>` : ""}
      <footer>${(i.links || []).map(u => `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${tipoLink(u)} ↗</a>`).join("")}
        <span class="chip ${i.status === "usada" ? "ok" : i.status === "descartada" ? "" : "acc"}">${ROT[i.status || "nova"] || esc(i.status)}</span>
        <span>${i.criado ? fmt(i.criado) : ""}</span>
        ${(i.status || "nova") === "nova" ? `<button type="button" class="mini" data-apagar>apagar</button>` : ""}</footer>
    </div>
    ${i.claude ? `<div class="resp"><b>Claude, na hora</b>${esc(i.claude)}</div>` : ""}
    ${i.resposta ? `<div class="resp"><b>Produção</b>${esc(i.resposta)}</div>` : ""}`).join("")
    : `<p class="vazio">Nenhuma ideia para ${esc(CANAIS[canal].nome)} ainda. Cole um link de Reel ou Shorts que você curtiu, mande um print ou escreva o que quer ver no canal.</p>`;
  if (fim) el.scrollTop = el.scrollHeight;
  $("#compor").hidden = !db;
  $("#anexar").hidden = !assets;
}

let anexos = [];
function mostrarAnexos() {
  $("#anexos").innerHTML = anexos.map((a, n) => `<span><img src="${a.prev}" alt="anexo ${n + 1}"><button type="button" data-tirar="${n}" aria-label="Tirar anexo">×</button></span>`).join("");
}
function anexar(files) {
  if (!assets) { $("#st-ideia").textContent = "Mandar print só funciona para quem edita esta página."; return; }
  for (const f of files) if (f.type.startsWith("image/")) anexos.push({ file: f, prev: URL.createObjectURL(f) });
  mostrarAnexos();
}
$("#anexar").onclick = () => $("#arquivo").click();
$("#arquivo").onchange = e => { anexar(e.target.files); e.target.value = ""; };
$("#anexos").onclick = e => { const n = e.target.dataset.tirar; if (n != null) { anexos.splice(+n, 1); mostrarAnexos(); } };
$("#texto").addEventListener("paste", e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); anexar(fs); } });
const compor = $("#compor");
compor.addEventListener("dragover", e => { e.preventDefault(); compor.classList.add("drop"); });
compor.addEventListener("dragleave", () => compor.classList.remove("drop"));
compor.addEventListener("drop", e => { e.preventDefault(); compor.classList.remove("drop"); anexar([...e.dataTransfer.files]); });
$("#texto").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) compor.requestSubmit(); });

compor.addEventListener("submit", async e => {
  e.preventDefault();
  const texto = $("#texto").value.trim();
  if (!texto && !anexos.length) return;
  const st = $("#st-ideia"), btn = $("#enviar");
  btn.disabled = true;
  try {
    const imagens = [];
    for (const [n, a] of anexos.entries()) {
      st.textContent = `Enviando print ${n + 1} de ${anexos.length}…`;
      const r = await assets.upload(a.file);
      imagens.push({ id: r.id, url: r.url });
    }
    st.textContent = "Salvando…";
    const doc = { canal, texto, links: texto.match(LINK) || [], imagens, autor: eu, criado: new Date().toISOString(), status: "nova" };
    const ref = await db.collection("ideias").add(doc);
    $("#texto").value = ""; anexos = []; mostrarAnexos();
    try { localStorage.removeItem("rasc-ideia"); } catch (err) {}
    st.textContent = "Ideia salva. A produção lê antes do próximo vídeo.";
    responder(ref?.id, doc);
  } catch (err) {
    st.textContent = err?.code === "too_large" ? "Esse print é grande demais (até 20 MB)." : "Não salvou: " + (err?.message || err?.code || "erro") + ". Tente de novo.";
  }
  btn.disabled = false;
});
$("#texto").addEventListener("input", () => { try { localStorage.setItem("rasc-ideia", $("#texto").value); } catch (e) {} });
try { $("#texto").value = localStorage.getItem("rasc-ideia") || ""; } catch (e) {}

async function responder(id, doc) {
  if (!sample || !id) return;
  const c = CANAIS[canal];
  const prompt = `Você é o produtor do canal "${c.nome}" (${c.sobre.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ")}).
O dono do canal, Pedro, mandou esta ideia de vídeo pelo painel. Responda em português do Brasil, em 2 a 4 frases curtas e diretas, como num chat: diga como você transformaria isso num Short do canal (gancho dos primeiros 2 segundos e o formato), ou, se não combina com o canal, diga por quê. Você não consegue abrir links: se só houver link, diga o que vai checar nele quando for produzir.

Mensagem do Pedro:
${doc.texto || "(só imagem)"}${doc.links.length ? "\nLinks: " + doc.links.map(tipoLink).join(", ") : ""}`;
  try {
    const lim = await sample.limits?.().catch(() => null);
    const opts = { cache: false };
    if (lim?.images && doc.imagens.length) {
      const blobs = await Promise.all(doc.imagens.slice(0, 3).map(m => fetch(m.url).then(r => r.blob()).catch(() => null)));
      if (blobs.filter(Boolean).length) opts.images = blobs.filter(Boolean);
    }
    const { text } = await sample(prompt, opts);
    if (text) await db.collection("ideias").doc(id).update({ claude: text.trim() });
  } catch (e) {}
}

/* ---------- ações nos cards ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest(".conta");
  if (b) { canal = b.dataset.c; try { localStorage.setItem("canal", canal); } catch (err) {} render(); return; }
  const t = e.target.closest("nav button");
  if (t) { aba = t.dataset.aba; try { localStorage.setItem("aba", aba); } catch (err) {} render(); return; }
  const apagar = e.target.closest("[data-apagar]");
  if (apagar && db) { const id = apagar.closest(".msg").dataset.id; try { await db.collection("ideias").doc(id).delete(); } catch (err) { $("#st-ideia").textContent = "Não apagou: " + (err.message || err.code); } return; }
  const m = e.target.closest("#modo-lista, #modo-grade");
  if (m) { modo = m.id === "modo-lista" ? "lista" : "grade"; $("#progresso").textContent = ""; try { localStorage.setItem("modo", modo); } catch (err) {} render(); return; }
  if (e.target.closest("#sel-todos")) {
    const vis = visiveis(), todos = vis.length && vis.every(i => sel.has(canal + "_" + i.codigo));
    vis.forEach(i => todos ? sel.delete(canal + "_" + i.codigo) : sel.add(canal + "_" + i.codigo));
    render(); return;
  }
  if (e.target.closest("#baixar-sel")) { baixar(visiveis().filter(i => sel.has(canal + "_" + i.codigo))); return; }
  const row = e.target.closest(".row");
  if (row) {
    const it = itensDe(canal).find(i => i.codigo === row.dataset.k);
    if (e.target.closest("[data-baixar-um]") && it) { baixar([it]); return; }
    if (e.target.closest("[data-abrir]")) { const k = canal + "_" + row.dataset.k; expandidos.has(k) ? expandidos.delete(k) : expandidos.add(k); render(); }
    return;
  }
  const cardEl = e.target.closest(".card"); if (!cardEl) return;
  const cod = cardEl.dataset.k, it = itensDe(canal).find(i => i.codigo === cod), st = cardEl.querySelector(".status");
  if (e.target.closest("[data-baixar]") && it && dl) {
    const btn = e.target.closest("[data-baixar]"); btn.disabled = true; btn.textContent = "Preparando…";
    try {
      const blob = await (await fetch(it.video)).blob();
      btn.textContent = "Confirme na janela";
      await dl.save({ filename: `${canal}_${cod}.mp4`, data: blob });
      btn.textContent = "Baixado";
    } catch (err) { btn.textContent = err?.code === "declined" ? "⬇ Baixar vídeo" : "Não baixou, tente de novo"; }
    btn.disabled = false; return;
  }
  if (!db || !eu) return;
  const v = e.target.closest("[data-v]");
  if (v) {
    const id = `${canal}_${cod}_${eu}`, ref = db.collection("avaliacoes").doc(id);
    try { votos[id]?.nota === v.dataset.v ? await ref.delete() : await ref.set({ canal, codigo: cod, nota: v.dataset.v, autor: eu, quando: new Date().toISOString() }); }
    catch (err) { if (st) st.textContent = "Não salvou o voto: " + (err.message || err.code); }
  }
  if (e.target.closest("[data-p]")) {
    const ta = cardEl.querySelector("textarea"), texto = ta.value.trim(); if (!texto) { st.textContent = "Escreva o pedido antes de enviar."; return; }
    const btn = e.target.closest("[data-p]"); btn.disabled = true; st.textContent = "Enviando…";
    try { await db.collection("pedidos").add({ canal, codigo: cod, texto, autor: eu, criado: new Date().toISOString(), status: "aberto" }); rascunhos[canal + "_" + cod] = ""; ta.value = ""; st.textContent = "Pedido enviado."; }
    catch (err) { st.textContent = "Não enviou: " + (err.message || err.code); }
    btn.disabled = false;
  }
});

render();
(async () => {
  db = await claude.use("db");
  if (!db) { render(); return; }
  user = await claude.use("user");
  eu = user ? await user.id() : null;
  [assets, dl, sample] = await Promise.all([claude.use("assets"), claude.use("downloads"), claude.use("sample")]);
  render();
  db.collection("canais").onSnapshot(s => { docs = {}; s.docs.forEach(d => docs[d.id] = d.data()); render(); }, () => {});
  db.collection("pedidos").onSnapshot(s => { pedidos = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  db.collection("avaliacoes").onSnapshot(s => { votos = {}; s.docs.forEach(d => votos[d.id] = d.data()); render(); }, () => {});
  db.collection("ideias").onSnapshot(s => { ideias = s.docs.map(d => ({ id: d.id, ...d.data() })); renderChat(); render(); }, () => {});
})();
</script>
